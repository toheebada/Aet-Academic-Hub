<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AET Admin</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#080b63">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AET Admin">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/png" sizes="192x192" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="admin.webmanifest">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#fff;background:radial-gradient(ellipse at 50% 0%,#1b2394,#080b63 60%,#03041f)}
.card{width:100%;max-width:420px;text-align:center}
.logo{width:84px;height:84px;border-radius:22px;background:#fff;box-shadow:0 10px 30px rgba(0,0,0,.4)}
h1{font-size:26px;margin:18px 0 4px}
p{margin:0 0 18px;color:#c9cdf5;font-size:15px;line-height:1.5}
.btn{display:block;width:100%;padding:14px 18px;border:0;border-radius:12px;font-size:16px;font-weight:700;text-decoration:none;cursor:pointer;margin-top:10px}
.gold{background:#ffc81f;color:#0a0f5c}
.ghost{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.25)}
.steps{display:none;text-align:left;background:rgba(255,255,255,.08);border-radius:14px;padding:14px 16px;margin-top:14px;font-size:14px;line-height:1.6;color:#e5e7ff}
.steps b{color:#ffc81f}
</style>
</head>
<body>
<div class="card" id="card">
  <img class="logo" src="apple-touch-icon.png" alt="">
  <h1>AET Admin</h1>
  <p id="msg">Put the admin panel on your home screen so it opens like an app.</p>
  <button class="btn gold" id="install" style="display:none">Add to home screen</button>
  <div class="steps" id="ios"><b>On iPhone:</b> tap the <b>Share</b> button in Safari, scroll down, tap <b>Add to Home Screen</b>, then <b>Add</b>.</div>
  <div class="steps" id="android"><b>On Android:</b> tap the <b>⋮</b> menu in Chrome, then <b>Add to Home screen</b> (or <b>Install app</b>).</div>
  <a class="btn ghost" href="/?admin=1">Open admin now</a>
</div>
<noscript><p><a href="/?admin=1" style="color:#ffc81f">Open admin</a></p></noscript>
<script>
(function(){
  var standalone = false;
  try { standalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true; } catch(e){}
  // Launched from the home-screen icon: go straight to the admin panel.
  if (standalone) { location.replace('/?admin=1'); return; }

  var ua = navigator.userAgent || '';
  var isIOS = /iphone|ipad|ipod/i.test(ua);
  var isAndroid = /android/i.test(ua);
  var deferred = null;
  var btn = document.getElementById('install');
  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault(); deferred = e; btn.style.display = 'block';
    document.getElementById('android').style.display = 'none';
  });
  btn.addEventListener('click', function(){
    if (!deferred) return;
    deferred.prompt();
    deferred.userChoice.then(function(){ deferred = null; btn.style.display = 'none'; });
  });
  window.addEventListener('appinstalled', function(){
    document.getElementById('msg').textContent = 'Installed. Open AET Admin from your home screen.';
    btn.style.display = 'none';
  });
  if (isIOS) document.getElementById('ios').style.display = 'block';
  else if (isAndroid) document.getElementById('android').style.display = 'block';
})();
</script>
</body>
</html>
